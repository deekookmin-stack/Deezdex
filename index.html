<style>
:root{--g:#ead4a4;--r:#9b1b30;--m:#3a0a16;--bg:#1a0509}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#2e0812,#0e0208 75%) fixed;color:#f6e6d0;font:14px Quicksand,system-ui,sans-serif;min-height:100vh}
.wrap{position:relative;z-index:2;max-width:1100px;margin:auto;padding:14px}
h1,h2{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;text-transform:none;margin:0;color:var(--g);text-shadow:0 0 8px rgba(245,197,107,.35)}
header{text-align:center}
.ttl{display:flex;align-items:center;gap:12px;position:relative}.ttl svg{width:34px;height:34px;flex:none}.hd{font:400 30px/1.25 Pacifico,cursive;font-style:normal;color:#e0a878;text-shadow:0 0 12px rgba(232,160,184,.55);margin:32px 0 4px}.sec{padding:6px 2px}.sec>small:first-child{letter-spacing:.14em}.st{background:#310a17;position:relative;transition:transform .2s}.st:hover{transform:translateY(-3px) rotate(-1deg)}.st:after{content:attr(data-s);position:absolute;top:6px;right:10px;color:#ff9ab8;opacity:.6;font-size:15px}.ring{background:#310a17;display:flex;align-items:center;gap:14px}.ring svg{width:84px;height:84px;flex:none}.ft{margin:24px 0 10px;text-align:center}.ft small{display:block;margin-top:4px;font-size:10px;letter-spacing:.1em;opacity:.5}
.ft-row{display:flex;align-items:center;width:100vw;position:relative;left:50%;transform:translateX(-50%);padding:0 16px}
.ft-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#e8a0b8 20%,#e8a0b8 80%,transparent)}
.ft-row svg{width:46px;height:36px;flex:none;color:#e8a0b8;margin:0 10px}.two{display:grid;grid-template-columns:1fr;gap:12px;margin:12px 0}@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}.lw,.rw{transform-origin:32px 30px;animation:wf 1.6s ease-in-out infinite}
.lockup{display:flex;flex-direction:column;align-items:center;gap:0;width:100%;text-align:center}

}

 $('#app').innerHTML=`<div class="row"><h2 style="font-size:20px">Accounts</h2><button class="b g" onclick="addA()">+ Add account</button></div><div class="grid">${S.accounts.map(a=>{let o=0,d=0;C.forEach(c=>{const s=stat(a.id,c);o+=s.o;d+=s.d});return`<div class="box"><b>${a.name}</b> ${a.is_main?'<span class="tag">Main</span>':''}<br><small>${o} unique · ${d} with dupes</small><br><small class="gt">${timeAgo(a.last_synced_at)}</small><div class="row"><button class="b g" onclick="imp('${a.id}')">Import</button><button class="b" onclick="impThumbs('${a.id}')">Import thumbnails</button><button class="b" onclick="ren('${a.id}')">Rename</button>${a.is_main?'':`<button class="b" onclick="del('${a.id}')">Remove</button>`}</div></div>`}).join('')}</div>`

const md=h=>{$('#md').innerHTML=h?`<div class="mod" onclick="if(event.target==this)md('')"><div class="box">${h}</div></div>`:''};
function ed(k){
 const c=CM[k],e=(S.inv[AC]||{})[k]||[];
 md(`<h2 style="font-size:18px">${c.n}</h2><small>${A(AC).name} · ${e.length}/${c.q} cards. Fix counts by hand if an import got something wrong.</small>${e.map((x,i)=>`<div class="li"><span style="display:flex;align-items:center;gap:8px">${x[4]?`<img src="${x[4]}" style="width:30px;height:42px;object-fit:cover;border-radius:4px">`:''}${x[0]}</span><span><button class="b" onclick="adj('${k}',${i},-1)">−</button> <b>×${x[1]}</b> <button class="b" onclick="adj('${k}',${i},1)">+</button></span></div>`).join('')}
 <div class="row"><select id="nm">${M.map(x=>`<option>${x}</option>`).join('')}</select><button class="b g" onclick="adj('${k}',-1,1)">Add card</button><button class="b" onclick="md('')">Close</button></div>`)
}
async function adj(k,i,d){
 const a=(S.inv[AC]=S.inv[AC]||{}),e=(a[k]=a[k]||[]);
 if(i<0){
  const slot=e.length;e.push([$('#nm').value,1,slot,null]);
  const {data}=await sb.from('inventory').insert({user_id:USER.id,account_id:AC,collection_key:k,member:$('#nm').value,slot_index:slot,copies:1}).select();
  if(data)e[e.length-1][3]=data[0].id
 }else{
  e[i][1]=Math.max(0,e[i][1]+d);
  if(e[i][3])await sb.from('inventory').update({copies:e[i][1]}).eq('id',e[i][3]);
  if(!e[i][1]&&e[i][3]){await sb.from('inventory').delete().eq('id',e[i][3]);e.splice(i,1)}
 }
 touch(AC);
 ed(k);if(V=='col')G()
}

function imp(id){
 md(`<h2 style="font-size:18px">Import into ${A(id).name}</h2><small>On BCD (logged into this account) open Photocards. First time, scroll all the way down before copying. After that you only need to scroll to where new or changed cards are — anything further down that you don't paste is left untouched.</small><textarea id="pt" rows="8" placeholder="Paste here, or choose a .txt file below…"></textarea><div class="row"><input type="file" accept=".txt" id="fpick" onchange="loadTxt(event,'${id}')" style="max-width:220px"></div><div class="row"><button class="b g" onclick="pv('${id}')">Preview</button><button class="b" onclick="md('')">Cancel</button></div><div id="pr"></div>`)
}
function loadTxt(ev,id){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{$('#pt').value=r.result;pv(id)};
 r.readAsText(f)
}
let PI;
function pv(id){
 const t=$('#pt').value,lines=t.split(/\r?\n/).map(l=>l.trim());
 const inv={},bad={};let n=0,i=0;
 while(i<lines.length){
  const x=parseMemberLine(lines[i]);
  if(!x){i++;continue}
  i++;
  while(i<lines.length&&lines[i]==='')i++;
  if(i>=lines.length)break;
  const collLine=lines[i];i++;
  let j=i;while(j<lines.length&&lines[j]==='')j++;
  let qty=1;
  if(j<lines.length&&/^[×x]\d+$/.test(lines[j])){qty=parseInt(lines[j].slice(1));i=j+1}else{i=j}
  const k=matchKey(collLine);
  if(!k){const rk=nz(collLine);(bad[rk]=bad[rk]||{name:collLine,cards:[]}).cards.push([x,qty]);continue}
  (inv[k]=inv[k]||[]).push([x,qty]);n++
 }
 const grouped={};
 Object.entries(inv).forEach(([k,list])=>{
  const byM={};list.forEach(([x,q])=>{(byM[x]=byM[x]||[]).push(q)});grouped[k]=byM
 });
 const oldInv=S.inv[id]||{},changes=[],adds=[],risky=[];
 Object.entries(grouped).forEach(([k,byM])=>{
  Object.entries(byM).forEach(([x,newQ])=>{
   const oldList=(oldInv[k]||[]).filter(r=>r[0]==x).map(r=>r[1]),
   oldSum=oldList.reduce((a,b)=>a+b,0),newSum=newQ.reduce((a,b)=>a+b,0);
   if(!oldList.length){adds.push(`${CM[k].n} · ${x} (${newQ.join(', ')} cop${newQ.length>1?'ies':'y'})`);return}
   if(oldList.length>1&&newQ.length<oldList.length){
    risky.push({k,x,oldLen:oldList.length,newLen:newQ.length,oldSum,newSum,newQ});
    delete grouped[k][x];if(!Object.keys(grouped[k]).length)delete grouped[k];
    return
   }
   if(oldSum!=newSum)changes.push(`${CM[k].n} · ${x}: ${oldSum} → ${newSum}`)
  })
 });
 PI={id,grouped,risky};
 const badList=Object.entries(bad);
 $('#pr').innerHTML=`<p><b>${n}</b> cards read, <b>${Object.keys(grouped).length}</b> collections touched.</p>
 ${adds.length?`<div class="sec"><small>NEW (${adds.length})</small>${adds.slice(0,15).map(x=>`<div class="li"><span>${x}</span></div>`).join('')}${adds.length>15?'<small>+'+(adds.length-15)+' more</small>':''}</div>`:''}
 ${changes.length?`<div class="sec"><small>CHANGED (${changes.length})</small>${changes.slice(0,15).map(x=>`<div class="li"><span>${x}</span></div>`).join('')}${changes.length>15?'<small>+'+(changes.length-15)+' more</small>':''}</div>`:''}
 ${risky.length?`<div class="sec"><small>SKIPPED FOR SAFETY (${risky.length}) — this paste shows fewer cards for these than what's saved, which usually means it just didn't scroll far enough to cover them, not that you lost cards. Left untouched unless you confirm.</small>${risky.map((r,i)=>`<div class="li"><span>${CM[r.k].n} · ${r.x}: had ${r.oldLen} cards (${r.oldSum} total) → paste shows ${r.newLen} (${r.newSum} total)</span><button class="b" onclick="applyRisky(${i})">Apply anyway</button></div>`).join('')}</div>`:''}
 ${!adds.length&&!changes.length&&!risky.length&&n?'<p>No changes from what’s already saved for this account.</p>':''}
 ${badList.length?`<div class="sec"><small>NOT RECOGNISED (${badList.length}) — map these once and they'll work forever after</small>${badList.map(([rk,b])=>`<div class="li"><span>${b.name} <span class="gt">(${b.cards.length} card${b.cards.length>1?'s':''})</span></span><span><select id="map_${rk}"><option value="">choose collection…</option>${C.map(c=>`<option value="${c.k}">${c.n}</option>`).join('')}</select> <button class="b" onclick="mapAlias('${rk}','${id}')">Map</button></span></div>`).join('')}</div>`:''}
 ${n?'<button class="b g" onclick="cm()">Save these updates</button>':''}`
}
function applyRisky(i){
 const r=PI.risky[i];
 (PI.grouped[r.k]=PI.grouped[r.k]||{})[r.x]=r.newQ;
 PI.risky.splice(i,1);
 const el=event.target.closest('.li');if(el)el.remove()
}

function impThumbs(id){
 md(`<h2 style="font-size:18px">Import thumbnails into ${A(id).name}</h2><small>Choose the deezdex-thumbs.txt file captured from BCD for this account. This teaches the app which exact card image is which, so ambiguous collections (⚠) can be matched precisely instead of guessed.</small><input type="file" accept=".txt" id="tfpick" onchange="loadThumbsFile(event,'${id}')" style="max-width:220px;margin-top:8px"><div class="row"><button class="b" onclick="md('')">Cancel</button></div><div id="tpr"></div>`)
}
function loadThumbsFile(ev,id){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{window._lastThumbsRaw=r.result;pvThumbs(id,r.result)};
 r.readAsText(f)
}
function parseThumbsBlocks(text){
 const blocks=text.split('---'),out=[];
 blocks.forEach(b=>{
  const m=b.match(/\[IMG\](\S+)/);if(!m)return;
  const url=m[1],lines=b.slice(0,m.index).split(/\r?\n/).map(l=>l.trim());
  let i=0;
  while(i<lines.length){
   const x=parseMemberLine(lines[i]);
   if(!x){i++;continue}
   i++;
   while(i<lines.length&&lines[i]==='')i++;
   if(i>=lines.length)break;
   const collLine=lines[i];i++;
   let j=i;while(j<lines.length&&lines[j]==='')j++;
   let qty=1;
   if(j<lines.length&&/^[×x]\d+$/.test(lines[j]))qty=parseInt(lines[j].slice(1));
   out.push({x,collLine,qty,url});break
  }
 });
 return out
}
let PIT;
function pvThumbs(id,text){
 const parsed=parseThumbsBlocks(text),grouped={},bad={};let n=0;
 parsed.forEach(({x,collLine,qty,url})=>{
  const k=matchKey(collLine);
  if(!k){const rk=nz(collLine);(bad[rk]=bad[rk]||{name:collLine,cards:[]}).cards.push([x,qty]);return}
  const g=(grouped[k]=grouped[k]||{});(g[x]=g[x]||[]).push({q:qty,url});n++
 });
 Object.values(grouped).forEach(byM=>Object.values(byM).forEach(list=>list.sort((a,b)=>a.url<b.url?-1:1)));
 PIT={id,grouped};
 const badList=Object.entries(bad);
 $('#tpr').innerHTML=`<p><b>${n}</b> cards read with images, <b>${Object.keys(grouped).length}</b> collections touched.</p>
 ${badList.length?`<div class="sec"><small>NOT RECOGNISED (${badList.length})</small>${badList.map(([rk,b])=>`<div class="li"><span>${b.name} <span class="gt">(${b.cards.length} card${b.cards.length>1?'s':''})</span></span><span><select id="tmap_${rk}"><option value="">choose collection…</option>${C.map(c=>`<option value="${c.k}">${c.n}</option>`).join('')}</select> <button class="b" onclick="mapAliasT('${rk}','${id}',this)">Map</button></span></div>`).join('')}</div>`:''}
 ${n?'<button class="b g" onclick="cmThumbs()">Save these thumbnails</button>':''}`
}
async function mapAliasT(rawKey,id){
 const sel=document.getElementById('tmap_'+rawKey),canon=sel.value;if(!canon)return;
 await saveAlias(rawKey,canon);

}

 md('<div class="box">Saving…</div>');

   Object.entries(byM).forEach(([x,entries])=>payload.push({k,m:x,entries}))

  if(error)throw error;

}
