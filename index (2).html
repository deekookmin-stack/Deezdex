<script>
const SB_URL='https://khztibipwtjcofufseij.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoenRpYmlwd3RqY29mdWZzZWlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MjExODIsImV4cCI6MjEwNjE5NzE4Mn0.NBqruy3mxqNQBqf80wTPWdWYcRhCFY-GeZFyZJa3Llg';
const sb=supabase.createClient(SB_URL,SB_KEY);
const M=['RM','Jin','SUGA','j-hope','Jimin','V','Jung Kook','BTS'],SOLO_TOKENS=[...M,'Agust D'],nz=s=>s.normalize('NFKC').toUpperCase().replace(/[^\p{L}\p{N}]/gu,'');
let ALIAS={};
const _sn=s=>s.toLowerCase().replace(/[^a-z]/g,''),SoloNz=SOLO_TOKENS.map(_sn);
function parseMemberLine(line){
 const ln=_sn(line),idx=SoloNz.indexOf(ln);
 if(idx>=0)return SOLO_TOKENS[idx];
 const parts=line.split(/,|&|\band\b/i).map(p=>p.trim()).filter(Boolean);
 if(parts.length>=2){
  const resolved=[];
  for(const p of parts){
   const pn=_sn(p),i2=M.map(_sn).indexOf(pn);
   if(i2<0)return null;
   resolved.push(M[i2])
  }
  resolved.sort((a,b)=>M.indexOf(a)-M.indexOf(b));
  return resolved.join(' & ')
 }
 return null
}
const TN={reg:'Regular',am:'Album Mission'};
let C=[],CM={},S={accounts:[],inv:{}},V='home',F='all',OS='all',DS='all',Q='',AC=null,GOAL='goal2',USER=null;

async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){renderAuth();return}

 sb.auth.onAuthStateChange((e,s)=>{if(e=='SIGNED_OUT')location.reload()});
 await loadCollections();await loadAliases();await loadAccounts();
 GOAL=localStorage.getItem('deezdex_goal')||'goal2';
 R()
}
function $(q){return document.querySelector(q)}
function renderAuth(){
 $('#app').innerHTML=`<div class="box" style="max-width:380px;margin:40px auto"><h2 style="font-size:20px">sign in</h2><div class="row"><input id="em" placeholder="email"></div><div class="row"><input id="pw" type="password" placeholder="password"></div><div class="row"><button class="b on" onclick="doAuth('in')">Sign in</button><button class="b" onclick="doAuth('up')">Create account</button></div><small id="ae"></small></div>`;
 $('#nav').innerHTML=''
}
async function doAuth(k){
 const email=$('#em').value.trim(),password=$('#pw').value;
 const {error}=k=='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(error){$('#ae').textContent=error.message;return}
 location.reload()
}
async function loadCollections(){
 const {data,error}=await sb.from('global_collections').select('*').order('name');
 if(error){$('#app').innerHTML='<div class="box">Could not load collections: '+error.message+'</div>';return}
 C=data.map(r=>({n:r.name,k:r.key,t:r.type,q:r.qty}));CM=Object.fromEntries(C.map(c=>[c.k,c]))
}
async function loadAliases(){
 const {data}=await sb.from('collection_aliases').select('*');
 ALIAS=Object.fromEntries((data||[]).map(r=>[r.raw_key,r.canonical_key]))
}
function matchKey(raw){
 const k=nz(raw);
 if(CM[k])return k;
 if(ALIAS[k]&&CM[ALIAS[k]])return ALIAS[k];
 return null
}
async function saveAlias(rawKey,canonicalKey){
 ALIAS[rawKey]=canonicalKey;
 await sb.from('collection_aliases').insert({raw_key:rawKey,canonical_key:canonicalKey,created_by:USER.id})
}
async function loadAccounts(){
 const {data:accs}=await sb.from('accounts').select('*').order('created_at');
 S.accounts=accs||[];
 if(!S.accounts.length){
   const {data:a}=await sb.from('accounts').insert({user_id:USER.id,name:'Main Account',is_main:true}).select();
   S.accounts=a
 }
 AC=AC||S.accounts[0].id;
 let inv=[],from=0;const page=1000;
 while(true){
  const {data,error}=await sb.from('inventory').select('*').eq('user_id',USER.id).range(from,from+page-1);
  if(error||!data)break;
  inv=inv.concat(data);
  if(data.length<page)break;
  from+=page
 }
 S.inv={};inv.forEach(r=>{const a=(S.inv[r.account_id]=S.inv[r.account_id]||{});(a[r.collection_key]=a[r.collection_key]||[]).push([r.member,r.copies,r.slot_index,r.id,r.image_url])});
 Object.values(S.inv).forEach(a=>Object.values(a).forEach(arr=>arr.sort((x,y)=>x[2]-y[2])))
}
const A=id=>S.accounts.find(a=>a.id==id)||S.accounts[0];
const scope=()=>GOAL=='goal1'?C.filter(c=>c.t=='reg'):C;
const stat=(aid,c)=>{const e=(S.inv[aid]||{})[c.k]||[];return{o:e.filter(x=>x[1]>0).length,d:e.filter(x=>x[1]>1).length}};
const stO=(aid,c)=>{const s=stat(aid,c);return s.o==0?'none':s.o>=c.q?'full':'prog'};
const stD=(aid,c)=>{const s=stat(aid,c);return s.d==0?'none':s.d>=c.q?'full':'prog'};
function needFor(targetId){
 const target=A(targetId),rows=[];
 scope().forEach(c=>{
  const g=aid=>{const o={};((S.inv[aid]||{})[c.k]||[]).forEach(r=>{const mem=r[0],copies=r[1],url=r[4];(o[mem]=o[mem]||[]).push({q:copies,url})});return o};
  const mg=g(target.id),others=S.accounts.filter(a=>a.id!=target.id).map(a=>[a,g(a.id)]);
  const keys=new Set(Object.keys(mg));others.forEach(([a,o])=>Object.keys(o).forEach(k=>keys.add(k)));
  keys.forEach(x=>{
   const tlist=mg[x]||[];
   const len=Math.max(tlist.length,...others.map(([a,o])=>(o[x]||[]).length),0);
   for(let i=0;i<len;i++){
    const te=tlist[i],mc=te?te.q:0;if(mc>1)continue;
    let src=[],amb=false;
    if(te&&te.url){
     src=others.map(([a,o])=>{
      const m=(o[x]||[]).find(e=>e.url===te.url);
      return m&&m.q>1?[a.name,m.q-1]:null
     }).filter(Boolean)
    }
    if(!src.length){
     src=others.map(([a,o])=>[a.name,((o[x]||[])[i]?.q||0)-1]).filter(s=>s[1]>0);
     amb=len>1
    }
    if(src.length)rows.push({c,x,i,mc,src,amb})
   }
  })
 });return rows
}
function need(){return needFor((S.accounts.find(a=>a.is_main)||S.accounts[0]).id)}
function timeAgo(iso){
 if(!iso)return 'never imported';
 const s=Math.floor((Date.now()-new Date(iso))/1000);
 if(s<60)return 'just now';
 if(s<3600)return Math.floor(s/60)+'m ago';
 if(s<86400)return Math.floor(s/3600)+'h ago';
 if(s<2592000)return Math.floor(s/86400)+'d ago';
 return new Date(iso).toLocaleDateString()
}

 if(a)a.last_synced_at=now;

}

 $('#nav').innerHTML=NV.map(([k,l])=>`<button class="b ${V==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')+`<button class="b" onclick="sb.auth.signOut()">Sign out</button>`;
 if(V=='home')return home();

}

 return `<div class="row"><small>Goal:</small><button class="b ${GOAL=='goal1'?'on':''}" onclick="setGoal('goal1')">2x every Regular card</button><button class="b ${GOAL=='goal2'?'on':''}" onclick="setGoal('goal2')">2x every card (Regular + Album Mission)</button></div>`

function home(){
 const main=S.accounts.find(a=>a.is_main)||S.accounts[0],sc=scope();
 const P={reg:[0,0,0],am:[0,0,0]},status={none:0,prog:0,own:0,full:0},near=[];let tot=0;
 sc.forEach(c=>{const s=stat(main.id,c),oS=stO(main.id,c),dS=stD(main.id,c);tot+=c.q;const p=P[c.t];p[0]+=s.o;p[1]+=s.d;p[2]+=c.q;
  const k=oS=='full'?(dS=='full'?'full':'own'):oS;status[k]++;
  if(s.o&&dS!='full')near.push([c,c.q-s.d])});
 near.sort((a,b)=>a[1]-b[1]);const nd=need(),mo=P.reg[0]+P.am[0],md=P.reg[1]+P.am[1],pc=(a,b)=>b?Math.round(a/b*100):0,bar=(a,b)=>`<div class="bar"><i style="width:${pc(a,b)}%"></i></div>`,
 Q=['shuffle up — your cards are waiting ✦','every spare is a little treasure','may your pulls be ever in your favour','spare copies do not collect themselves','a butterfly in the deck brings luck','no card left behind'],
 cir=2*Math.PI*34;
 $('#app').innerHTML=`<h2 class="hd">welcome to your deck</h2><small>${Q[Math.floor(Date.now()/864e5)%Q.length]}</small>
 ${goalRow()}
 <div class="box ring" style="margin:12px 0"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="34" fill="none" stroke="#000a" stroke-width="7"/><circle cx="42" cy="42" r="34" fill="none" stroke="#ead4a4" stroke-width="7" stroke-linecap="round" stroke-dasharray="${cir*pc(mo,tot)/100} ${cir}" transform="rotate(-90 42 42)"/><text x="42" y="47" text-anchor="middle" fill="#fff1d6" font-size="16" font-weight="700" font-family="Quicksand">${pc(mo,tot)}%</text></svg><div><b>the whole deck</b><br><small>${mo.toLocaleString()} of ${tot.toLocaleString()} cards in your hand<br>${pc(md,tot)}% of them already have spares</small></div></div>
 <div class="stats">${[[sc.length,'sets in the box','♠'],[tot.toLocaleString(),'cards in play','♥'],[S.accounts.length,'players at the table','♦'],[nd.length,'cards up for grabs','♣']].map(([a,b,x])=>`<div class="box st" data-s="${x}"><div class="big">${a}</div><small>${b}</small></div>`).join('')}</div>
 <div class="two"><div class="sec"><small>YOUR HAND · held / spares</small>${[['Regular','reg'],['Album Mission','am']].filter(([l,k])=>GOAL=='goal2'||k=='reg').map(([l,k])=>`<div style="margin-top:10px">${l}<small style="float:right">${P[k][0]}/${P[k][2]} · ${P[k][1]}/${P[k][2]}</small>${bar(P[k][0],P[k][2])}${bar(P[k][1],P[k][2])}</div>`).join('')}</div>
 <div class="sec"><small>THE SHUFFLE</small>${[['untouched packs','none'],['half-dealt','prog'],['full hands, no spares','own'],['royal flush ✦','full']].map(([l,k])=>`<div class="li"><span>${l}</span><b class="big">${status[k]}</b></div>`).join('')}</div></div>
 <div class="two"><div class="sec"><small>ALMOST A FULL HOUSE</small>${near.slice(0,6).map(([c,x])=>`<div class="li"><span>${c.n}</span><span class="tag">${x} to go</span></div>`).join('')||'<div class="li">Import Main to deal this hand.</div>'}</div>
 <div class="sec"><small>THE TABLE</small>${S.accounts.map(a=>{let o=0,d=0;sc.forEach(c=>{const s=stat(a.id,c);o+=s.o;d+=s.d});return`<div class="li"><span>${a.name}${a.is_main?' <span class="gt">main</span>':''}</span><small>${o} held · ${d} spare</small></div>`}).join('')}</div></div>

const md=h=>{$('#md').innerHTML=h?`<div class="mod" onclick="if(event.target==this)md('')"><div class="box">${h}</div></div>`:''};
function ed(k){
 const c=CM[k],e=(S.inv[AC]||{})[k]||[];

 <div class="row"><select id="nm">${M.map(x=>`<option>${x}</option>`).join('')}</select><button class="b g" onclick="adj('${k}',-1,1)">Add card</button><button class="b" onclick="md('')">Close</button></div>`)

async function adj(k,i,d){
 const a=(S.inv[AC]=S.inv[AC]||{}),e=(a[k]=a[k]||[]);
 if(i<0){
  const slot=e.length;e.push([$('#nm').value,1,slot,null]);
  const {data}=await sb.from('inventory').insert({user_id:USER.id,account_id:AC,collection_key:k,member:$('#nm').value,slot_index:slot,copies:1}).select();
  if(data)e[e.length-1][3]=data[0].id
 }else{
  e[i][1]=Math.max(0,e[i][1]+d);
  if(e[i][3])await sb.from('inventory').update({copies:e[i][1]}).eq('id',e[i][3]);
  if(!e[i][1]&&e[i][3]){await sb.from('inventory').delete().eq('id',e[i][3]);e.splice(i,1)}
 }
 touch(AC);
 ed(k);if(V=='col')G()
}

function imp(id){
 md(`<h2 style="font-size:18px">Import into ${A(id).name}</h2><small>On BCD (logged into this account) open Photocards. First time, scroll all the way down before copying. After that you only need to scroll to where new or changed cards are — anything further down that you don't paste is left untouched.</small><textarea id="pt" rows="8" placeholder="Paste here, or choose a .txt file below…"></textarea><div class="row"><input type="file" accept=".txt" id="fpick" onchange="loadTxt(event,'${id}')" style="max-width:220px"></div><div class="row"><button class="b g" onclick="pv('${id}')">Preview</button><button class="b" onclick="md('')">Cancel</button></div><div id="pr"></div>`)
}
function loadTxt(ev,id){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{$('#pt').value=r.result;pv(id)};
 r.readAsText(f)
}
let PI;
function pv(id){
 const t=$('#pt').value,lines=t.split(/\r?\n/).map(l=>l.trim());
 const inv={},bad={};let n=0,i=0;
 while(i<lines.length){
  const x=parseMemberLine(lines[i]);
  if(!x){i++;continue}
  i++;
  while(i<lines.length&&lines[i]==='')i++;
  if(i>=lines.length)break;
  const collLine=lines[i];i++;
  let j=i;while(j<lines.length&&lines[j]==='')j++;
  let qty=1;
  if(j<lines.length&&/^[×x]\d+$/.test(lines[j])){qty=parseInt(lines[j].slice(1));i=j+1}else{i=j}
  const k=matchKey(collLine);
  if(!k){const rk=nz(collLine);(bad[rk]=bad[rk]||{name:collLine,cards:[]}).cards.push([x,qty]);continue}
  (inv[k]=inv[k]||[]).push([x,qty]);n++
 }
 const grouped={};
 Object.entries(inv).forEach(([k,list])=>{
  const byM={};list.forEach(([x,q])=>{(byM[x]=byM[x]||[]).push(q)});grouped[k]=byM
 });
 const oldInv=S.inv[id]||{},changes=[],adds=[],risky=[];
 Object.entries(grouped).forEach(([k,byM])=>{
  Object.entries(byM).forEach(([x,newQ])=>{
   const oldList=(oldInv[k]||[]).filter(r=>r[0]==x).map(r=>r[1]),
   oldSum=oldList.reduce((a,b)=>a+b,0),newSum=newQ.reduce((a,b)=>a+b,0);
   if(!oldList.length){adds.push(`${CM[k].n} · ${x} (${newQ.join(', ')} cop${newQ.length>1?'ies':'y'})`);return}
   if(oldList.length>1&&newQ.length<oldList.length){
    risky.push({k,x,oldLen:oldList.length,newLen:newQ.length,oldSum,newSum,newQ});
    delete grouped[k][x];if(!Object.keys(grouped[k]).length)delete grouped[k];
    return
   }
   if(oldSum!=newSum)changes.push(`${CM[k].n} · ${x}: ${oldSum} → ${newSum}`)
  })
 });
 PI={id,grouped,risky};
 const badList=Object.entries(bad);
 $('#pr').innerHTML=`<p><b>${n}</b> cards read, <b>${Object.keys(grouped).length}</b> collections touched.</p>
 ${adds.length?`<div class="sec"><small>NEW (${adds.length})</small>${adds.slice(0,15).map(x=>`<div class="li"><span>${x}</span></div>`).join('')}${adds.length>15?'<small>+'+(adds.length-15)+' more</small>':''}</div>`:''}
 ${changes.length?`<div class="sec"><small>CHANGED (${changes.length})</small>${changes.slice(0,15).map(x=>`<div class="li"><span>${x}</span></div>`).join('')}${changes.length>15?'<small>+'+(changes.length-15)+' more</small>':''}</div>`:''}
 ${risky.length?`<div class="sec"><small>SKIPPED FOR SAFETY (${risky.length}) — this paste shows fewer cards for these than what's saved, which usually means it just didn't scroll far enough to cover them, not that you lost cards. Left untouched unless you confirm.</small>${risky.map((r,i)=>`<div class="li"><span>${CM[r.k].n} · ${r.x}: had ${r.oldLen} cards (${r.oldSum} total) → paste shows ${r.newLen} (${r.newSum} total)</span><button class="b" onclick="applyRisky(${i})">Apply anyway</button></div>`).join('')}</div>`:''}
 ${!adds.length&&!changes.length&&!risky.length&&n?'<p>No changes from what’s already saved for this account.</p>':''}
 ${badList.length?`<div class="sec"><small>NOT RECOGNISED (${badList.length}) — map these once and they'll work forever after</small>${badList.map(([rk,b])=>`<div class="li"><span>${b.name} <span class="gt">(${b.cards.length} card${b.cards.length>1?'s':''})</span></span><span><select id="map_${rk}"><option value="">choose collection…</option>${C.map(c=>`<option value="${c.k}">${c.n}</option>`).join('')}</select> <button class="b" onclick="mapAlias('${rk}','${id}')">Map</button></span></div>`).join('')}</div>`:''}
 ${n?'<button class="b g" onclick="cm()">Save these updates</button>':''}`
}
function applyRisky(i){
 const r=PI.risky[i];
 (PI.grouped[r.k]=PI.grouped[r.k]||{})[r.x]=r.newQ;
 PI.risky.splice(i,1);
 const el=event.target.closest('.li');if(el)el.remove()
}

function impThumbs(id){
 md(`<h2 style="font-size:18px">Import thumbnails into ${A(id).name}</h2><small>Choose the deezdex-thumbs.txt file captured from BCD for this account. This teaches the app which exact card image is which, so ambiguous collections (⚠) can be matched precisely instead of guessed.</small><input type="file" accept=".txt" id="tfpick" onchange="loadThumbsFile(event,'${id}')" style="max-width:220px;margin-top:8px"><div class="row"><button class="b" onclick="md('')">Cancel</button></div><div id="tpr"></div>`)
}
function loadThumbsFile(ev,id){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{window._lastThumbsRaw=r.result;pvThumbs(id,r.result)};
 r.readAsText(f)
}
function parseThumbsBlocks(text){
 const blocks=text.split('---'),out=[];
 blocks.forEach(b=>{
  const m=b.match(/\[IMG\](\S+)/);if(!m)return;
  const url=m[1],lines=b.slice(0,m.index).split(/\r?\n/).map(l=>l.trim());
  let i=0;
  while(i<lines.length){
   const x=parseMemberLine(lines[i]);
   if(!x){i++;continue}
   i++;
   while(i<lines.length&&lines[i]==='')i++;
   if(i>=lines.length)break;
   const collLine=lines[i];i++;
   let j=i;while(j<lines.length&&lines[j]==='')j++;
   let qty=1;
   if(j<lines.length&&/^[×x]\d+$/.test(lines[j]))qty=parseInt(lines[j].slice(1));
   out.push({x,collLine,qty,url});break
  }
 });
 return out
}
let PIT;
function pvThumbs(id,text){
 const parsed=parseThumbsBlocks(text),grouped={},bad={};let n=0;
 parsed.forEach(({x,collLine,qty,url})=>{
  const k=matchKey(collLine);
  if(!k){const rk=nz(collLine);(bad[rk]=bad[rk]||{name:collLine,cards:[]}).cards.push([x,qty]);return}
  const g=(grouped[k]=grouped[k]||{});(g[x]=g[x]||[]).push({q:qty,url});n++
 });
 Object.values(grouped).forEach(byM=>Object.values(byM).forEach(list=>list.sort((a,b)=>a.url<b.url?-1:1)));
 PIT={id,grouped};
 const badList=Object.entries(bad);
 $('#tpr').innerHTML=`<p><b>${n}</b> cards read with images, <b>${Object.keys(grouped).length}</b> collections touched.</p>
 ${badList.length?`<div class="sec"><small>NOT RECOGNISED (${badList.length})</small>${badList.map(([rk,b])=>`<div class="li"><span>${b.name} <span class="gt">(${b.cards.length} card${b.cards.length>1?'s':''})</span></span><span><select id="tmap_${rk}"><option value="">choose collection…</option>${C.map(c=>`<option value="${c.k}">${c.n}</option>`).join('')}</select> <button class="b" onclick="mapAliasT('${rk}','${id}',this)">Map</button></span></div>`).join('')}</div>`:''}
 ${n?'<button class="b g" onclick="cmThumbs()">Save these thumbnails</button>':''}`
}
async function mapAliasT(rawKey,id){

async function cmThumbs(){
 const {id,grouped}=PIT;
 md('<div class="box">Saving…</div>');

  const payload=[];

   Object.entries(byM).forEach(([x,entries])=>payload.push({k,m:x,entries}))
  });

  if(error)throw error;

}
